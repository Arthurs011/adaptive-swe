services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: adaptive_swe
      POSTGRES_PASSWORD: adaptive_swe
      POSTGRES_DB: adaptive_swe
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports: ["8000:8000"]
    env_file: .env
    depends_on: [postgres]
    environment:
      DATABASE_URL: postgresql://adaptive_swe:adaptive_swe@postgres:5432/adaptive_swe
    volumes:
      - repo_data:/app/backend/storage
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    depends_on: [backend]

volumes:
  pgdata:
  repo_data: